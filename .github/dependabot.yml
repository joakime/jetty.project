version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 0
    target-branch: "jetty-9.4.x"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[9.4.x] "

  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 0
    target-branch: "jetty-10.0.x"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[10.0.x] "

  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 0
    target-branch: "jetty-11.0.x"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[11.0.x] "

  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 0
    target-branch: "jetty-12.0.x"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[12.0.x] "

  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 0
    target-branch: "jetty-12.1.x"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[12.1.x] "
